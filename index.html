<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F2937">
  <meta name="description" content="YHT 수주 / 납품 / 정산 통합관리">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">

  <title>YHT 관리장부</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f3f4f6;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Malgun Gothic",
        sans-serif;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.10);
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #1F2937;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.6;
    }

    .open-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: #1F2937;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .install-btn {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      background: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="logo">YHT</div>

    <h1>YHT 관리장부</h1>

    <p>
      수주 · 납품 · 정산<br>
      통합관리 시스템
    </p>

    <a
      class="open-btn"
      href="https://script.google.com/macros/s/AKfycbxRkZb7qNPF88_W73d8OeZQDJWzZndt5kP80LSY4FrXISjQFoK3ylMw0WUBR2uYUaam/exec"
      target="_blank"
      rel="noopener"
    >
      YHT 관리장부 열기
    </a>

    <button id="installBtn" class="install-btn">
      📱 앱으로 설치하기
    </button>

    <div class="notice">
      인터넷 연결이 필요합니다.
    </div>

  </div>
</div>

<script>
  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    const installBtn = document.getElementById("installBtn");
    installBtn.style.display = "block";

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      await deferredPrompt.userChoice;

      deferredPrompt = null;
      installBtn.style.display = "none";
    });
  });

  window.addEventListener("appinstalled", () => {
    const installBtn = document.getElementById("installBtn");
    installBtn.style.display = "none";
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./service-worker.js")
        .catch(err => console.error("Service Worker:", err));
    });
  }
</script>

</body>
</html>
