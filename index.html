<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>YHT 관리장부</title>

  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="YHT 관리장부">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
</head>

<body style="
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5f6f8;
  font-family:Arial,'Noto Sans KR',sans-serif;
">

  <div style="
    width:calc(100% - 40px);
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:35px 25px;
    box-sizing:border-box;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
  ">

    <h1 style="margin:0 0 10px;font-size:28px;">
      YHT 관리장부
    </h1>

    <p style="margin:0 0 30px;color:#666;font-size:15px;">
      YHT 수주 / 납품 / 정산 통합관리
    </p>

    <!-- 일반 브라우저용 -->
    <a
      id="openLedger"
      href="https://script.google.com/macros/s/AKfycbxRkZb7qNPF88_W73d8OeZQDJWzZndt5kP80LSY4FrXISjQFoK3ylMw0WUBR2uYUaam/exec"
      target="_blank"
      rel="noopener"
      style="
        display:block;
        box-sizing:border-box;
        width:100%;
        padding:16px;
        border-radius:12px;
        background:#111;
        color:white;
        text-decoration:none;
        font-size:17px;
        font-weight:bold;
      "
    >
      YHT 관리장부 열기
    </a>

    <!-- 카카오톡 인앱 브라우저에서만 표시 -->
    <div
      id="kakaoGuide"
      style="
        display:none;
        margin-top:20px;
        padding:18px;
        border-radius:14px;
        background:#fff7d6;
        color:#444;
        font-size:14px;
        line-height:1.6;
      "
    >
      <strong>📱 카카오톡에서는 바로 열리지 않을 수 있습니다.</strong>
      <br>
      아래 버튼을 눌러 외부 브라우저에서 열어주세요.
    </div>

    <a
      id="chromeButton"
      href="#"
      style="
        display:none;
        box-sizing:border-box;
        width:100%;
        margin-top:12px;
        padding:15px;
        border-radius:12px;
        background:#4285f4;
        color:white;
        text-decoration:none;
        font-size:16px;
        font-weight:bold;
      "
    >
      🌐 Chrome에서 YHT 관리장부 열기
    </a>

    <!-- PWA 설치 버튼 -->
    <button
      id="installButton"
      style="
        display:none;
        width:100%;
        margin-top:12px;
        padding:14px;
        border:1px solid #ddd;
        border-radius:12px;
        background:white;
        font-size:15px;
        cursor:pointer;
      "
    >
      📱 앱으로 설치하기
    </button>

  </div>

<script>
  const APP_URL =
    "https://script.google.com/macros/s/AKfycbxRkZb7qNPF88_W73d8OeZQDJWzZndt5kP80LSY4FrXISjQFoK3ylMw0WUBR2uYUaam/exec";

  const ua = navigator.userAgent || navigator.vendor || window.opera;

  // 카카오톡 인앱 브라우저 감지
  const isKakaoTalk =
    /KAKAOTALK/i.test(ua) ||
    /KakaoTalk/i.test(ua);

  // Android인지 확인
  const isAndroid = /Android/i.test(ua);

  // iPhone/iPad인지 확인
  const isIOS =
    /iPhone|iPad|iPod/i.test(ua);

  const guide = document.getElementById("kakaoGuide");
  const chromeButton = document.getElementById("chromeButton");
  const openLedger = document.getElementById("openLedger");

  if (isKakaoTalk) {

    guide.style.display = "block";
    chromeButton.style.display = "block";

    /*
      Android:
      Chrome 앱으로 직접 열도록 intent URL 사용
    */
    if (isAndroid) {

      const intentUrl =
        "intent://script.google.com/macros/s/AKfycbxRkZb7qNPF88_W73d8OeZQDJWzZndt5kP80LSY4FrXISjQFoK3ylMw0WUBR2uYUaam/exec" +
        "#Intent;scheme=https;package=com.android.chrome;end";

      chromeButton.href = intentUrl;

    } else if (isIOS) {

      /*
        iPhone:
        Chrome가 설치되어 있으면 Chrome으로 열기 시도
      */
      const chromeUrl =
        "googlechrome://navigate?url=" +
        encodeURIComponent(APP_URL);

      chromeButton.href = chromeUrl;

    } else {

      /*
        기타 환경
      */
      chromeButton.href = APP_URL;
    }

    // 카카오톡에서는 기본 버튼 대신 외부 브라우저 버튼 사용
    openLedger.style.display = "none";
  }

  // PWA 설치
  let deferredPrompt;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    const installButton =
      document.getElementById("installButton");

    installButton.style.display = "block";

    installButton.addEventListener("click", async () => {

      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      const { outcome } =
        await deferredPrompt.userChoice;

      deferredPrompt = null;

      if (outcome === "accepted") {
        installButton.style.display = "none";
      }
    });
  });

  // 서비스 워커
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .catch(err => {
          console.log("Service Worker 등록 실패:", err);
        });
    });
  }
</script>

</body>
</html>
